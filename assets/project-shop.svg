<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img"><title>E-commerce de Tênis</title><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.silk{fill:#e6edf3}.muted{fill:#8fa89b}.gold{fill:#d9a441}.green{fill:#39d353}
.trace{fill:none;stroke:#d9a441;stroke-width:2;opacity:.45}
.pulse{fill:none;stroke:#39d353;stroke-width:3;stroke-linecap:round;
  stroke-dasharray:70 530;animation:flow 3s linear infinite}
.chip{fill:#10171a;stroke:#d9a441;stroke-width:1.5}
.led{fill:#39d353;animation:blink 1.6s ease-in-out infinite}
@keyframes flow{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.blip{animation:blink 1.8s ease-in-out infinite}
.route{stroke-dasharray:9 7;animation:route 1.5s linear infinite}
@keyframes route{to{stroke-dashoffset:-32}}
.ride{animation:ride 8s linear infinite}
@keyframes ride{to{transform:translateX(580px)}}
.ball{animation:ball 7s ease-in-out infinite}
@keyframes ball{0%,100%{transform:translate(90px,62px)}25%{transform:translate(210px,28px)}50%{transform:translate(300px,90px)}75%{transform:translate(412px,62px)}}
.tag{fill:#1a2a22;stroke:#2f5d45}
</style><rect width="500" height="400" rx="16" fill="#07130e"/><rect x="8" y="8" width="484" height="384" rx="11" fill="none" stroke="#143126" stroke-width="2"/><circle cx="24" cy="24" r="7" fill="#000" stroke="#d9a441" stroke-width="2.5"/><circle cx="476" cy="24" r="7" fill="#000" stroke="#d9a441" stroke-width="2.5"/><circle cx="24" cy="376" r="7" fill="#000" stroke="#d9a441" stroke-width="2.5"/><circle cx="476" cy="376" r="7" fill="#000" stroke="#d9a441" stroke-width="2.5"/><text x="48" y="44" font-size="15" class="gold">A5</text><circle cx="310" cy="39" r="5.5" fill="#d9a441"/><text x="324" y="44" font-size="14" class="muted">acadêmico</text><rect x="36" y="62" width="428" height="130" rx="6" fill="#04100a"/><path class="trace" d="M146 127.0 H200.0 M300.0 127.0 H354"/><path class="pulse" pathLength="600" d="M146 127.0 H200.0 M300.0 127.0 H354"/><rect class="chip" x="46" y="97.0" width="100" height="60" rx="5"/><text x="96" y="134.0" font-size="19" class="silk" text-anchor="middle" font-weight="700">SITE</text><rect class="chip" x="200.0" y="97.0" width="100" height="60" rx="5"/><text x="250.0" y="134.0" font-size="19" class="silk" text-anchor="middle" font-weight="700">API</text><rect class="chip" x="354" y="97.0" width="100" height="60" rx="5"/><text x="404" y="134.0" font-size="19" class="silk" text-anchor="middle" font-weight="700">SQL</text><text x="250.0" y="182" font-size="13" class="muted" text-anchor="middle">{ "produto": "tênis" }</text><text x="36" y="232" font-size="22" font-weight="700" class="silk">E-commerce de Tênis</text><text x="36" y="262" font-size="16" class="silk">Site de vendas full stack com consumo de API,</text><text x="36" y="284" font-size="16" class="silk">banco relacional e manipulação de JSON.</text><rect class="tag" x="36" y="331" width="45" height="27" rx="5"/><text x="45" y="350" font-size="15" class="green">API</text><rect class="tag" x="89" y="331" width="45" height="27" rx="5"/><text x="98" y="350" font-size="15" class="green">SQL</text><rect class="tag" x="142" y="331" width="54" height="27" rx="5"/><text x="151" y="350" font-size="15" class="green">JSON</text></svg>
