ted">detecção de</text><text x="65.0" y="358" font-size="15" class="muted">anomalias</text><path class="trace" d="M318.0 190 V226"/><path class="pulse" pathLength="600" d="M318.0 190 V226" style="stroke-dasharray:200 400;animation-delay:0.4s"/><rect class="chip feat" x="233.0" y="226" width="170" height="172" rx="6" style="animation-delay:1s"/><circle class="led" cx="383.0" cy="250" r="5.5" style="animation-delay:0.3s"/><text x="247.0" y="264" font-size="27" font-weight="700" class="silk">DATA</text><text x="247.0" y="298" font-size="15" class="muted">Python, Pandas,</text><text x="247.0" y="318" font-size="15" class="muted">SQL e MongoDB</text><path class="trace" d="M500.0 190 V226"/><path class="pulse" pathLength="600" d="M500.0 190 V226" style="stroke-dasharray:200 400;animation-delay:0.8s"/><rect class="chip feat" x="415.0" y="226" width="170" height="172" rx="6" style="animation-delay:2s"/><circle class="led" cx="565.0" cy="250" r="5.5" style="animation-delay:0.6s"/><text x="429.0" y="264" font-size="27" font-weight="700" class="silk">BI</text><text x="429.0" y="298" font-size="15" class="muted">Dashboards e</text><text x="429.0" y="318" font-size="15" class="muted">indicadores no</text><text x="429.0" y="338" font-size="15" class="muted">Power BI</text><path class="trace" d="M682.0 190 V226"/><path class="pulse" pathLength="600" d="M682.0 190 V226" style="stroke-dasharray:200 400;animation-delay:1.2s"/><rect class="chip feat" x="597.0" y="226" width="170" height="172" rx="6" style="animation-delay:3s"/><circle class="led" cx="747.0" cy="250" r="5.5" style="animation-delay:0.9s"/><text x="611.0" y="264" font-size="27" font-weight="700" class="silk">LGPD</text><text x="611.0" y="298" font-size="15" class="muted">Governança e</text><text x="611.0" y="318" font-size="15" class="muted">LGPD na prática,</text><text x="611.0" y="338" font-size="15" class="muted">no QuintoAndar</text><path class="trace" d="M864.0 190 V226"/><path class="pulse" pathLength="600" d="M864.0 190 V226" style="stroke-dasharray:200 400;animation-delay:1.6s"/><rect class="chip feat" x="779.0" y="226" width="170" height="172" rx="6" style="animation-delay:4s"/><circle class="led" cx="929.0" cy="250" r="5.5" style="animation-delay:1.2s"/><text x="793.0" y="264" font-size="27" font-weight="700" class="silk">n8n</text><text x="793.0" y="298" font-size="15" class="muted">Automação de</text><text x="793.0" y="318" font-size="15" class="muted">processos e</text><text x="793.0" y="338" font-size="15" class="muted">rotinas</text></svg>
