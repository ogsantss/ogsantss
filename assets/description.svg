<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><title>Descrição geral e características</title><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.silk{fill:#e6edf3}.muted{fill:#8fa89b}.gold{fill:#d9a441}.green{fill:#39d353}
.trace{fill:none;stroke:#d9a441;stroke-width:2;opacity:.45}
.pulse{fill:none;stroke:#39d353;stroke-width:3;stroke-linecap:round;
  stroke-dasharray:70 530;animation:flow 3s linear infinite}
.chip{fill:#10171a;stroke:#d9a441;stroke-width:1.5}
.led{fill:#39d353;animation:blink 1.6s ease-in-out infinite}
@keyframes flow{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.cov{transform:translateX(900px)}
.c0{animation:c0 30s steps(70) infinite}.c1{animation:c1 30s steps(70) infinite}.c2{animation:c2 30s steps(70) infinite}
@keyframes c0{0%{transform:translateX(0)}4%,100%{transform:translateX(900px)}}
@keyframes c1{0%,4%{transform:translateX(0)}8%,100%{transform:translateX(900px)}}
@keyframes c2{0%,8%{transform:translateX(0)}12%,100%{transform:translateX(900px)}}
.feat{animation:feat 5s ease-in-out infinite}
@keyframes feat{0%,100%{stroke:#d9a441}10%{stroke:#39d353}25%{stroke:#d9a441}}
